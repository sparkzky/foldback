[package]
name = "foldback"
version = "0.1.0"
edition = "2021"
description = "Reversible CLI output capture: run once, replay any channel byte-exact"
license = "MIT"

[[bin]]
name = "foldback"
path = "src/main.rs"

[lib]
name = "foldback_lib"
path = "src/lib.rs"

[dependencies]
rusqlite      = { version = "0.31", features = ["bundled"] }
sha2          = "0.10"
hex           = "0.4"
chrono        = { version = "0.4",  features = ["serde"] }
serde         = { version = "1",    features = ["derive"] }
serde_json    = "1"
rand          = "0.8"
thiserror     = "2"

[dev-dependencies]
tempfile    = "3"
assert_cmd  = "2"
predicates  = "3"
